<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poem Structure Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: a locksmith's workbench. Five color-coded stations, each = Learn (tutorial) -> Try it -> Unlock (practice). Poem panel sticks beside the questions on wide screens. */
:root{
  --bg:#EAF2FB; --paper:#FFFFFF; --paper2:#F5F8FD; --ink:#1A2242; --muted:#58628A; --line:#D3DDEE;
  --gold:#F2B21B; --gold-ink:#8A5A00; --teal:#0E9C98; --coral:#EF5B52; --violet:#7656DD; --blue:#2A73E0; --green:#23995A;
  --ok:#1E9A55; --no:#D8473F;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --poem:"Literata",Georgia,"Times New Roman",serif;
  --c:var(--teal);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1629; --paper:#18213A; --paper2:#1E2944; --ink:#EEF2FF; --muted:#A9B3D3; --line:#2E3A5C;
  --gold:#FFC53D; --gold-ink:#FFD877; --teal:#2CC4BF; --coral:#FF7A71; --violet:#9C82FF; --blue:#5A9BFF; --green:#3DC47A;
  --ok:#3DC47A; --no:#FF7A71; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1629; --paper:#18213A; --paper2:#1E2944; --ink:#EEF2FF; --muted:#A9B3D3; --line:#2E3A5C;
  --gold:#FFC53D; --gold-ink:#FFD877; --teal:#2CC4BF; --coral:#FF7A71; --violet:#9C82FF; --blue:#5A9BFF; --green:#3DC47A;
  --ok:#3DC47A; --no:#FF7A71; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,.tap:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* logo */
.lg-gold{fill:var(--gold)} .lg-goldd{fill:var(--gold-ink)} .lg-ink{fill:var(--ink)} .lg-paper{fill:var(--paper)}
.lg-teal{fill:var(--teal)} .lg-coral{fill:var(--coral)} .lg-violet{fill:var(--violet)} .lg-blue{fill:var(--blue)} .lg-green{fill:var(--green)}
.lg-stroke{stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:64px;height:auto;flex:none}
.brand .wm{font-family:var(--display);font-size:1.25rem;line-height:1}
.brand .wm span{display:block;font-family:var(--body);font-size:.68rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.wm b{font-weight:400} .wm .t1{color:var(--coral)} .wm .t2{color:var(--blue)} .wm .t3{color:var(--violet)}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:3px solid var(--gold);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topin{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-block:8px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--paper2);border-radius:999px;padding:5px 12px;font-size:.9rem;font-weight:700}
.timer{font-variant-numeric:tabular-nums;min-width:92px;justify-content:center}
.timer.late{border-color:var(--coral);color:var(--coral)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper2)}
.seg button{border:0;background:none;padding:5px 11px;font-size:.85rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.iconbtn{border:2px solid var(--line);background:var(--paper2);border-radius:999px;padding:5px 11px;font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;gap:5px}

/* station nav */
nav.stations{display:flex;gap:8px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:thin}
.st-tab{flex:none;display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:7px 12px 7px 8px;font-weight:700;font-size:.9rem;text-align:left}
.st-tab .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--sc);color:#fff;flex:none}
.st-tab small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.st-tab[aria-current="true"]{border-color:var(--sc);box-shadow:0 3px 0 var(--sc)}
.st-tab .key{display:none} .st-tab.won .key{display:block} .st-tab.won .lock{display:none}

/* panels */
section.panel{padding-top:14px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:center;background:var(--paper);border-radius:24px;padding:28px;border:2px solid var(--line)}
.hero h1{font-size:clamp(2rem,5vw,3.1rem);color:var(--ink)}
.hero h1 em{font-style:normal;color:var(--coral)}
.hero p{max-width:60ch}
.biglogo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.biglogo svg{width:min(240px,70%);height:auto}
.biglogo .wm{font-family:var(--display);font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.05}
.biglogo .tag{font-size:.9rem;color:var(--muted);font-weight:700;letter-spacing:.02em}
.route{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.route div{background:var(--paper2);border-radius:14px;padding:10px 12px;border-top:5px solid var(--sc)}
.route b{display:block;font-family:var(--display);font-weight:400;font-size:1.05rem}
.route span{font-size:.82rem;color:var(--muted)}
.namebox{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.namebox input{font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0;flex:1 1 220px;background:var(--paper2);color:var(--ink)}
.go{background:var(--coral);color:#fff;border:0;border-radius:14px;padding:12px 22px;font-family:var(--display);font-size:1.2rem;box-shadow:0 4px 0 color-mix(in srgb,var(--coral) 60%,#000)}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--coral) 60%,#000)}
.stds{margin-top:16px;font-size:.85rem;color:var(--muted)}
.stds b{color:var(--ink)}

.st-head{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--c);color:#fff;border-radius:22px;padding:18px 22px}
.st-head .num{font-family:var(--display);font-size:2.6rem;line-height:1;background:rgba(255,255,255,.22);border-radius:16px;width:62px;height:62px;display:grid;place-items:center;flex:none}
.st-head h2{font-size:clamp(1.5rem,3.5vw,2.1rem)}
.st-head p{margin:2px 0 0;opacity:.95}
.st-head .mins{margin-left:auto;background:rgba(0,0,0,.18);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;margin-top:18px;align-items:start}
.grid>*{min-width:0}
.learnrow{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:16px}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}

.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:18px 20px}
.learn{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,var(--paper))}
.label{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--c)}
.label .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.learn h3{font-size:1.4rem;margin:6px 0 8px}
.learn p{margin:.5em 0;max-width:62ch}
.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.flip{perspective:800px;border:0;background:none;padding:0;min-height:108px;text-align:left}
.flip .in{position:relative;width:100%;height:100%;min-height:108px;transition:transform .5s;transform-style:preserve-3d}
.flip[aria-pressed="true"] .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center}
.flip .f{background:var(--c);color:#fff}
.flip .f b{font-family:var(--display);font-weight:400;font-size:1.3rem}
.flip .f small{opacity:.9;font-size:.75rem}
.flip .b{background:var(--paper);border:2px solid var(--c);transform:rotateY(180deg);font-size:.9rem;line-height:1.35}
.demo{background:var(--paper);border:2px dashed var(--c);border-radius:16px;padding:14px 16px;margin-top:10px}
.demo-bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chipbtn{border:2px solid var(--c);color:var(--c);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem}
.chipbtn[aria-pressed="true"]{background:var(--c);color:#fff}
.tip{background:color-mix(in srgb,var(--gold) 22%,var(--paper));border-radius:14px;padding:10px 14px;font-size:.95rem;margin-top:10px}
.tip b{color:var(--gold-ink)}

/* poem */
.poem{font-family:var(--poem);font-size:1.02rem;line-height:1.7}
.poem h3{font-family:var(--poem);font-weight:600;font-size:1.2rem}
.poem .by{color:var(--muted);font-size:.85rem;margin-bottom:8px;font-family:var(--body)}
.stz{position:relative;padding:4px 0 4px 10px;margin:0 0 12px;border-left:4px solid transparent;border-radius:4px;transition:border-color .3s,background .3s}
.stz.xray{border-left-color:var(--sc,var(--c));background:color-mix(in srgb,var(--sc,var(--c)) 9%,transparent)}
.stz .stl{display:none;position:absolute;right:6px;top:4px;font-family:var(--body);font-size:.7rem;font-weight:700;color:var(--sc,var(--c));text-transform:uppercase;letter-spacing:.06em}
.stz.xray .stl{display:block}
.ln{display:flex;gap:10px;align-items:baseline;border-radius:8px;padding:0 6px;transition:background .2s}
.ln .n{font-family:var(--body);font-size:.72rem;color:var(--muted);width:20px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.ln .t{min-width:0}
.ln.tap{cursor:pointer;border:2px solid transparent}
.ln.tap:hover{background:color-mix(in srgb,var(--c) 10%,transparent)}
.ln.sel{background:color-mix(in srgb,var(--c) 22%,transparent);border-color:var(--c)}
.ln.right{background:color-mix(in srgb,var(--ok) 22%,transparent);border-color:var(--ok)}
.ln.flow{background:color-mix(in srgb,var(--gold) 35%,transparent)}
.tok{border-radius:5px;padding:0 1px;transition:background .2s}
.tok.tap{cursor:pointer;border-bottom:2px dotted color-mix(in srgb,var(--c) 45%,transparent)}
.tok.punct.tap{padding:0 5px;margin-left:1px;font-weight:600;background:color-mix(in srgb,var(--c) 8%,transparent)}
.tok.sel{background:var(--c);color:#fff}
.tok.right{background:var(--ok);color:#fff}
.tok.flow{background:color-mix(in srgb,var(--gold) 45%,transparent)}
.tok.spot{background:color-mix(in srgb,var(--blue) 30%,transparent);font-weight:600}
.rw{border-radius:6px;padding:0 3px;transition:background .3s}
.rw.rA{background:color-mix(in srgb,var(--coral) 30%,transparent)} .rw.rB{background:color-mix(in srgb,var(--blue) 30%,transparent)} .rw.rC{background:color-mix(in srgb,var(--green) 30%,transparent)}
.rl{display:inline-grid;place-items:center;min-width:26px;height:24px;border-radius:7px;font-family:var(--body);font-weight:700;font-size:.8rem;margin-left:8px;color:#fff}
.rl.rA{background:var(--coral)} .rl.rB{background:var(--blue)} .rl.rC{background:var(--green)}
.rbtn{margin-left:auto;flex:none;min-width:44px;height:34px;border-radius:10px;border:2px dashed var(--line);background:var(--paper2);font-family:var(--body);font-weight:700}
.rbtn.rA{background:var(--coral);color:#fff;border:2px solid var(--coral)} .rbtn.rB{background:var(--blue);color:#fff;border:2px solid var(--blue)} .rbtn.rC{background:var(--green);color:#fff;border:2px solid var(--green)}
.rbtn.right{outline:3px solid var(--ok);outline-offset:1px}

/* questions */
.q{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px 18px;transition:border-color .3s}
.q.ok{border-color:var(--ok)} .q.miss{border-color:var(--gold)}
.qtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.dok{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;border-radius:999px;padding:3px 10px;color:#fff}
.dok1{background:var(--teal)} .dok2{background:var(--violet)} .dok3{background:var(--coral)} .dokp{background:var(--muted)}
.qn{font-family:var(--display);font-size:1.05rem;color:var(--c)}
.listen{margin-left:auto;border:0;background:color-mix(in srgb,var(--blue) 14%,var(--paper));color:var(--blue);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:700;display:inline-flex;gap:5px;align-items:center}
.prompt{font-weight:700;margin:0 0 10px}
.prompt em{font-family:var(--poem);font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--paper2);border-radius:14px;padding:10px 12px;line-height:1.4}
.opt .lt{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--paper);border:2px solid var(--line);font-weight:700;font-size:.85rem}
.opt[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--paper))}
.opt[aria-pressed="true"] .lt{background:var(--c);color:#fff;border-color:var(--c)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.opt.right .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no)}
.numin{font:inherit;font-size:1.3rem;width:110px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--paper2);color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}
.qact{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.check{border:0;background:var(--c);color:#fff;border-radius:12px;padding:9px 18px;font-weight:700;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 55%,#000)}
.check:disabled{opacity:.45;cursor:default;box-shadow:none}
.tries{font-size:.82rem;color:var(--muted)}
.fb{margin-top:10px;border-radius:14px;padding:10px 14px;font-size:.95rem;display:none}
.fb.show{display:block}
.fb.good{background:color-mix(in srgb,var(--ok) 14%,var(--paper));border:2px solid var(--ok)}
.fb.hint{background:color-mix(in srgb,var(--gold) 20%,var(--paper));border:2px solid var(--gold)}
.fb.reveal{background:color-mix(in srgb,var(--violet) 12%,var(--paper));border:2px solid var(--violet)}
.fb b{font-family:var(--display);font-weight:400;font-size:1.05rem}
.stars{color:var(--gold);font-weight:700}

.done-bar{display:none;align-items:center;gap:14px;flex-wrap:wrap;background:var(--paper);border:3px solid var(--gold);border-radius:20px;padding:14px 18px}
.done-bar.show{display:flex}
.done-bar svg{width:46px;height:46px;flex:none}
.done-bar h3{font-size:1.3rem}
.done-bar .go{margin-left:auto}

/* writing */
.wtabs{display:flex;gap:8px;margin-bottom:8px}
textarea{font:inherit;width:100%;min-height:150px;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--paper2);color:var(--ink);resize:vertical}
.pad{position:relative;border:2px solid var(--line);border-radius:14px;background:repeating-linear-gradient(var(--paper2) 0 33px,var(--line) 33px 35px);touch-action:none}
.pad canvas{display:block;width:100%;height:260px;touch-action:none}
.padbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.swatch{width:28px;height:28px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.checklist{display:grid;gap:6px;margin-top:10px}
.checklist label{display:flex;gap:8px;align-items:flex-start;background:var(--paper2);border-radius:10px;padding:8px 10px}
.checklist input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--green)}
.model{margin-top:10px;background:color-mix(in srgb,var(--green) 10%,var(--paper));border:2px solid var(--green);border-radius:14px;padding:10px 14px}

/* report */
.rep{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:18px}
.big{font-family:var(--display);font-size:3rem;line-height:1;color:var(--c)}
.bars{display:grid;gap:10px;margin-top:8px}
.bar{display:grid;grid-template-columns:70px 1fr 54px;gap:8px;align-items:center;font-size:.9rem;font-variant-numeric:tabular-nums}
.bar .tr{height:16px;border-radius:999px;background:var(--paper2);overflow:hidden;border:1px solid var(--line)}
.bar .fl{height:100%;border-radius:999px;width:0;transition:width .8s}
.keys{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.keys .k{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:var(--paper2);border:2px dashed var(--line)}
.keys .k.won{background:var(--sc);border:2px solid var(--sc)}
.keys .k svg{width:34px;height:34px}
.cert{text-align:center;border:4px double var(--gold);border-radius:22px;padding:22px;background:var(--paper)}
.cert h2{font-size:clamp(1.6rem,4vw,2.3rem);color:var(--coral)}
.cert .who{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.6rem);color:var(--blue);margin:6px 0}
pre.copybox{white-space:pre-wrap;background:var(--paper2);border:2px solid var(--line);border-radius:14px;padding:12px;font-size:.85rem;max-height:260px;overflow:auto}

footer{margin-top:34px;padding-top:18px;border-top:2px solid var(--line);display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;color:var(--muted);font-size:.85rem}
footer .brand svg{width:46px}
.teacher{margin-top:14px}
.teacher[hidden]{display:none!important}
.keytable{width:100%;border-collapse:collapse;font-size:.88rem}
.keytable td,.keytable th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tblwrap{overflow-x:auto}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}

@media (max-width:860px){
  .grid,.hero{grid-template-columns:minmax(0,1fr)}
  .sticky{position:static}
  .hero{padding:20px}
  .st-head .mins{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="logo" viewBox="0 0 160 120">
      <!-- open book -->
      <path class="lg-violet" d="M8 66 Q44 52 80 66 Q116 52 152 66 L152 112 Q116 100 80 114 Q44 100 8 112 Z"/>
      <path class="lg-paper lg-stroke" d="M14 60 Q46 48 80 62 L80 106 Q46 94 14 106 Z"/>
      <path class="lg-paper lg-stroke" d="M146 60 Q114 48 80 62 L80 106 Q114 94 146 106 Z"/>
      <path class="lg-teal" d="M24 68 Q46 60 70 69 L70 73 Q46 64 24 72Z"/>

const FEM=/female|samantha|zira|aria|jenny|ava|allison|susan|victoria|michelle|emma|joanna|salli|kimberly|nicky|google us english/i;
const MAL=/\bmale\b|alex|david|guy|fred|aaron|tom\b|mark|davis|tony|evan|nathan|matthew|joey|justin|ryan|christopher|eric|roger|steffan/i;
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang))}catch(e){voices=[]}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pick(g){if(!voices.length)return null;const fem=voices.filter(v=>FEM.test(v.name)&&!/\bmale\b/i.test(v.name));const mal=voices.filter(v=>MAL.test(v.name)&&!/female/i.test(v.name));
  const pool=g==="male"?mal:fem;const pref=pool.find(v=>/google/i.test(v.name))||pool.find(v=>/natural|neural|enhanced|premium/i.test(v.name))||pool[0];return pref||voices[0]}
function clean(t){return t.replace(/ELA\.[A-Z0-9.]+/g,"").replace(/DOK\s*\d/g,"").replace(/[“”]/g,'"').replace(/\s+/g," ").trim()}
function say(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean(t));let g=voiceMode;if(g==="mix"){mixFlip=!mixFlip;g=mixFlip?"female":"male"}const v=pick(g);if(v)u.voice=v;u.lang="en-US";u.rate=.95;speechSynthesis.speak(u)}
document.querySelectorAll("[data-voice]").forEach(b=>b.addEventListener("click",()=>{voiceMode=b.dataset.voice;document.querySelectorAll("[data-voice]").forEach(x=>x.setAttribute("aria-pressed",x===b))}));
document.getElementById("stopTalk").addEventListener("click",()=>{try{speechSynthesis.cancel()}catch(e){}});
const SPK='<svg width="14" height="14" aria-hidden="true"><use href="#spk"/></svg>';
function listenBtn(txtFn){const b=document.createElement("button");b.className="listen";b.type="button";b.innerHTML=SPK+"Listen";b.addEventListener("click",()=>say(typeof txtFn==="function"?txtFn():txtFn));return b}

/* ---------------- helpers ---------------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function el(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild}
function poemText(lines){return lines.map(l=>l.t).join(" ")}
const STC=["var(--teal)","var(--coral)","var(--violet)","var(--blue)"];
function renderPoem(key,opt={}){
  const lines=POEMS[key].filter(l=>!opt.range||(l.n>=opt.range[0]&&l.n<=opt.range[1]));
  const box=document.createElement("div");box.className="poem";
  let cur=null,stEl=null;
  lines.forEach(l=>{
    if(l.st!==cur){cur=l.st;stEl=document.createElement("div");stEl.className="stz";stEl.style.setProperty("--sc",STC[(l.st-1)%4]);stEl.dataset.st=l.st;stEl.innerHTML='<span class="stl">Stanza '+l.st+'</span>';box.appendChild(stEl)}
    const row=document.createElement("div");row.className="ln";row.dataset.n=l.n;
    let inner;
    if(opt.mode==="tokens"||opt.tokens){inner=toks(l.t).map(tk=>'<span class="tok'+(tk.p?" punct":"")+'" data-k="'+l.n+":"+esc(tk.w)+":"+tk.occ+'" data-w="'+esc(tk.w.toLowerCase())+'">'+esc(tk.raw)+'</span>').join(" ").replace(/ <span class="tok punct"/g,'<span class="tok punct"')}
    else if(opt.rhymeWords){const ew=endWord(l.t);const i=l.t.lastIndexOf(ew);inner=esc(l.t.slice(0,i))+'<span class="rw">'+esc(ew)+'</span>'+esc(l.t.slice(i+ew.length))+'<span class="rl" hidden></span>'}
    else inner=esc(l.t);
    row.innerHTML='<span class="n">'+(opt.nums===false?"":l.n)+'</span><span class="t">'+inner+'</span>';
    stEl.appendChild(row);
  });
  return box;
}

/* ---------------- question engine ---------------- */
function qState(id){return S.q[id]||(S.q[id]={tries:0,status:null,val:null})}
function sameSet(a,b){a=[...a].map(String).sort();b=[...b].map(String).sort();return a.length===b.length&&a.every((x,i)=>x===b[i])}

function mountQ(q,idx){
  const st=qState(q.id);
  const card=el('<div class="q" id="q-'+q.id+'"></div>');
  const top=el('<div class="qtop"></div>');
  top.appendChild(el(q.dok?'<span class="dok dok'+q.dok+'">DOK '+q.dok+'</span>':'<span class="dok dokp">Practice</span>'));
  if(q.dok)top.appendChild(el('<span class="qn">Question '+idx+'</span>'));
  card.appendChild(top);
  const prompt=el('<p class="prompt">'+esc(q.prompt)+'</p>');card.appendChild(prompt);
  top.appendChild(listenBtn(()=>q.prompt+(q.opts?" . "+q.opts.map((o,i)=>"Choice "+"ABCD"[i]+". "+o).join(" . "):"")));
  const body=document.createElement("div");card.appendChild(body);
  let get,show,lock;
  if(q.type==="mc"||q.type==="multi"){
    const box=el('<div class="opts" role="group"></div>');let sel=q.type==="multi"?new Set(st.val||[]):(st.val??null);
    q.opts.forEach((o,i)=>{const b=el('<button type="button" class="opt" aria-pressed="false"><span class="lt">'+"ABCD"[i]+'</span><span>'+esc(o)+'</span></button>');
      b.addEventListener("click",()=>{if(card.dataset.locked)return;if(q.type==="multi"){sel.has(i)?sel.delete(i):sel.add(i)}else sel=i;paint()});box.appendChild(b)});
    function paint(){[...box.children].forEach((b,i)=>b.setAttribute("aria-pressed",q.type==="multi"?sel.has(i):sel===i))}
    paint();body.appendChild(box);
    get=()=>q.type==="multi"?[...sel]:sel;
    show=()=>{const ans=q.type==="multi"?q.answer:[q.answer];[...box.children].forEach((b,i)=>{if(ans.includes(i))b.classList.add("right");else if(b.getAttribute("aria-pressed")==="true")b.classList.add("wrong")})};
  }else if(q.type==="num"){
    const inp=el('<input class="numin" type="number" inputmode="numeric" min="0" max="99" id="in-'+q.id+'" aria-label="Your answer">');if(st.val!=null)inp.value=st.val;
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")checkBtn.click()});body.appendChild(inp);
    get=()=>inp.value===""?null:Number(inp.value);show=()=>{inp.value=q.answer;inp.style.borderColor="var(--ok)"};lock=()=>inp.disabled=true;
  }else if(q.type==="lines"||q.type==="tokens"){
    const p=renderPoem(q.poem,{range:q.range,tokens:q.type==="tokens"});const sel=new Set(st.val||[]);
    const items=q.type==="lines"?[...p.querySelectorAll(".ln")]:[...p.querySelectorAll(".tok")];
    items.forEach(it=>{const k=q.type==="lines"?it.dataset.n:it.dataset.k;it.classList.add("tap");it.tabIndex=0;it.setAttribute("role","button");
      const tog=()=>{if(card.dataset.locked)return;sel.has(k)?sel.delete(k):sel.add(k);it.classList.toggle("sel",sel.has(k));it.setAttribute("aria-pressed",sel.has(k))};
      it.addEventListener("click",tog);it.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tog()}});
      if(sel.has(k))it.classList.add("sel")});
    const wrap=el('<div class="demo" style="border-style:solid;margin-top:0"></div>');wrap.appendChild(p);body.appendChild(wrap);
    get=()=>[...sel];
    show=()=>{const ans=q.answer.map(String);items.forEach(it=>{const k=q.type==="lines"?it.dataset.n:it.dataset.k;it.classList.remove("sel");if(ans.includes(k))it.classList.add("right")})};
  }else if(q.type==="rhyme"){
    const p=renderPoem(q.poem,{range:q.range,rhymeWords:true});const rows=[...p.querySelectorAll(".ln")];const vals=(st.val||"").split("");
    const L=["","A","B","C"];
    rows.forEach((r,i)=>{const b=el('<button type="button" class="rbtn" aria-label="Rhyme letter for line '+r.dataset.n+'">?</button>');let v=vals[i]&&vals[i]!=="-"?vals[i]:"";
      const paint=()=>{b.textContent=v||"?";b.className="rbtn"+(v?" r"+v:"");const rw=r.querySelector(".rw");rw.className="rw"+(v?" r"+v:"")};
      b.addEventListener("click",()=>{if(card.dataset.locked)return;v=L[(L.indexOf(v)+1)%4];paint()});b.getVal=()=>v||"-";r.appendChild(b);paint()});
    const wrap=el('<div class="demo" style="border-style:solid;margin-top:0"></div>');wrap.appendChild(p);
    wrap.appendChild(el('<div class="tip" style="margin-top:8px"><b>How:</b> tap a box to cycle ? → A → B → C. Same sound = same letter.</div>'));body.appendChild(wrap);
    get=()=>rows.map(r=>r.querySelector(".rbtn").getVal()).join("");
    show=()=>{rows.forEach((r,i)=>{const b=r.querySelector(".rbtn");const v=q.answer[i];b.textContent=v;b.className="rbtn r"+v+" right";r.querySelector(".rw").className="rw r"+v})};
  }else if(q.type==="write"){mountWrite(q,card,body);return card}

  const act=el('<div class="qact"></div>');const checkBtn=el('<button type="button" class="check">Check</button>');const tries=el('<span class="tries"></span>');
  act.appendChild(checkBtn);act.appendChild(tries);card.appendChild(act);
  const fb=el('<div class="fb" role="status" aria-live="polite"></div>');card.appendChild(fb);

  function finish(status,msgType,html){st.status=status;card.dataset.locked="1";checkBtn.disabled=true;card.classList.add(status==="missed"?"miss":"ok");
    if(lock)lock();fb.className="fb show "+msgType;fb.innerHTML=html;
    if(status==="missed")show();else if(q.type!=="mc"&&q.type!=="multi"&&q.type!=="num")show();else show();
    tries.innerHTML=q.dok?(status==="first"?'<span class="stars">★★ First try!</span>':status==="second"?'<span class="stars">★ Second try</span>':"Answer shown"):"";
    const lb=listenBtn(()=>fb.textContent);lb.style.marginLeft="0";fb.appendChild(document.createElement("br"));fb.appendChild(lb);
    save();stationCheck(q.st)}
  checkBtn.addEventListener("click",()=>{
    const v=get();if(v===null||(Array.isArray(v)&&!v.length)||(typeof v==="string"&&/^-+$/.test(v))){fb.className="fb show hint";fb.innerHTML="<b>Pick an answer first.</b>";return}
    st.val=v;st.tries++;
    const ok=q.type==="mc"?v===q.answer:q.type==="num"?v===q.answer:q.type==="rhyme"?v===q.answer:sameSet(v,q.answer);
    if(ok){finish(st.tries===1?"first":"second","good","<b>Unlocked!</b> "+esc(q.explain));burst(card,8)}
    else if(st.tries===1){fb.className="fb show hint";fb.innerHTML="<b>Not yet. One more try.</b> "+esc(q.hint);tries.textContent="1 try left";save();if(q.type==="mc"){}}
    else{finish("missed","reveal","<b>Here’s the key.</b> "+(q.reveal?"Answer: "+esc(q.reveal)+". ":"")+esc(q.explain))}
  });
  if(st.status){card.dataset.locked="1";checkBtn.disabled=true;card.classList.add(st.status==="missed"?"miss":"ok");show();if(lock)lock();
    fb.className="fb show "+(st.status==="missed"?"reveal":"good");fb.innerHTML=(st.status==="missed"?"<b>Here’s the key.</b> ":"<b>Unlocked!</b> ")+esc(q.explain);
    tries.innerHTML=q.dok?(st.status==="first"?'<span class="stars">★★ First try!</span>':st.status==="second"?'<span class="stars">★ Second try</span>':"Answer shown"):""}
  else if(st.tries===1){tries.textContent="1 try left"}
  return card;
}

function mountWrite(q,card,body){
  const W=S.w;
  const tabs=el('<div class="wtabs"><button type="button" class="chipbtn" data-m="type" aria-pressed="true">Type it</button><button type="button" class="chipbtn" data-m="pen" aria-pressed="false">Write with pencil</button></div>');
  body.appendChild(tabs);
  const ta=el('<textarea id="cr-text" aria-label="Your written response" placeholder="Restate the question, answer it, cite two details with line numbers, and explain."></textarea>');ta.value=W.text||"";
  ta.addEventListener("input",()=>{W.text=ta.value;save();wc.textContent=count()+" words"});
  const padWrap=el('<div hidden><div class="pad"><canvas id="cr-pad" aria-label="Writing pad"></canvas></div><div class="padbar"><button type="button" class="swatch" style="background:#1A2242" aria-pressed="true" data-c="#1A2242" aria-label="Dark ink"></button><button type="button" class="swatch" style="background:#2A73E0" aria-pressed="false" data-c="#2A73E0" aria-label="Blue ink"></button><button type="button" class="swatch" style="background:#EF5B52" aria-pressed="false" data-c="#EF5B52" aria-label="Red ink"></button><button type="button" class="iconbtn" data-act="undo">Undo</button><button type="button" class="iconbtn" data-act="clear">Clear</button></div></div>');
  body.appendChild(ta);body.appendChild(padWrap);
  const wc=el('<div class="tries" style="margin-top:6px"></div>');body.appendChild(wc);
  function count(){return (W.text.trim().match(/\S+/g)||[]).length}
  wc.textContent=count()+" words";
  tabs.addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(!b)return;[...tabs.children].forEach(x=>x.setAttribute("aria-pressed",x===b));const pen=b.dataset.m==="pen";ta.hidden=pen;padWrap.hidden=!pen;if(pen)initPad()});
  // pad
  let strokes=[],color="#1A2242",ctx,cv,inited=false;
  function initPad(){if(inited){resize();return}inited=true;cv=padWrap.querySelector("canvas");ctx=cv.getContext("2d");
    try{strokes=W.ink?JSON.parse(W.ink):[]}catch(e){strokes=[]}
    resize();window.addEventListener("resize",resize);
    let cur=null;
    cv.addEventListener("pointerdown",e=>{if(card.dataset.locked)return;cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect();cur={c:color,p:[[ (e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,e.pressure||.5]]};strokes.push(cur)});
    cv.addEventListener("pointermove",e=>{if(!cur)return;const r=cv.getBoundingClientRect();cur.p.push([(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,e.pressure||.5]);draw()});
    const end=()=>{if(cur){cur=null;W.ink=JSON.stringify(strokes);save()}};cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
    padWrap.querySelector(".padbar").addEventListener("click",e=>{const s=e.target.closest(".swatch");if(s){color=s.dataset.c;padWrap.querySelectorAll(".swatch").forEach(x=>x.setAttribute("aria-pressed",x===s))}
      const a=e.target.closest("[data-act]");if(a&&!card.dataset.locked){if(a.dataset.act==="undo")strokes.pop();else strokes=[];W.ink=JSON.stringify(strokes);save();draw()}})}
  function resize(){if(!cv)return;const r=cv.getBoundingClientRect();const d=window.devicePixelRatio||1;cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);draw()}
  function draw(){if(!ctx)return;ctx.clearRect(0,0,cv.width,cv.height);ctx.lineCap="round";ctx.lineJoin="round";
    strokes.forEach(s=>{ctx.strokeStyle=s.c;for(let i=1;i<s.p.length;i++){const a=s.p[i-1],b=s.p[i];ctx.lineWidth=(1.5+b[2]*3)*(window.devicePixelRatio||1);ctx.beginPath();ctx.moveTo(a[0]*cv.width,a[1]*cv.height);ctx.lineTo(b[0]*cv.width,b[1]*cv.height);ctx.stroke()}})}
  const act=el('<div class="qact"><button type="button" class="check">Submit my response</button></div>');card.appendChild(act);
  const fb=el('<div class="fb" role="status" aria-live="polite"></div>');card.appendChild(fb);
  const after=el('<div hidden></div>');card.appendChild(after);
  after.appendChild(el('<p class="prompt" style="margin-top:12px">Self-check: tick each thing your answer does.</p>'));
  const cl=el('<div class="checklist"></div>');q.checklist.forEach((c,i)=>{const lab=el('<label><input type="checkbox" id="ck'+i+'"><span>'+esc(c)+'</span></label>');const cb=lab.querySelector("input");cb.checked=!!W.checks[i];cb.addEventListener("change",()=>{W.checks[i]=cb.checked;save()});cl.appendChild(lab)});after.appendChild(cl);
  const mdl=el('<div class="model"><span class="label" style="color:var(--green)"><span class="dot" style="background:var(--green)"></span>Model answer</span><p style="margin:.4em 0 0">'+esc(q.model)+'</p></div>');mdl.querySelector(".label").after(listenBtn(q.model));after.appendChild(mdl);
  const btn=act.querySelector("button");
  function done(){W.submitted=true;card.dataset.locked="1";card.classList.add("ok");ta.readOnly=true;btn.disabled=true;after.hidden=false;fb.className="fb show good";fb.innerHTML="<b>Response saved.</b> Now check it against the list and compare with the model answer.";save();stationCheck(q.st)}
  btn.addEventListener("click",()=>{const inked=(()=>{try{return JSON.parse(W.ink||"[]").length>2}catch(e){return false}})();if(count()<20&&!inked){fb.className="fb show hint";fb.innerHTML="<b>Keep going.</b> Write at least 20 words (or use the pencil pad) and include two details from the poem.";return}done();burst(card,14)});
  if(W.submitted)done();
}

function vocab(items){const g=el('<div class="vocab"></div>');items.forEach(([w,s,d])=>{const b=el('<button type="button" class="flip" aria-pressed="false"><div class="in"><div class="f"><b>'+esc(w)+'</b><small>'+esc(s)+'</small></div><div class="b">'+esc(d)+'</div></div></button>');b.addEventListener("click",()=>{const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);if(on)say(w+". "+d)});g.appendChild(b)});return g}

function learnCard(title,html,speak){const c=el('<div class="card learn"><span class="label"><span class="dot"></span>Learn it</span><h3>'+esc(title)+'</h3><div class="lb">'+html+'</div></div>');c.querySelector(".label").after(listenBtn(speak));return c}

    groups[gi].forEach(t=>t.classList.add("flow"));bar.firstChild.textContent="Show next sentence";bar.lastChild.textContent="Sentence "+(gi+1)+": notice how it "+(new Set(groups[gi].map(t=>t.closest(".ln").dataset.n)).size>1?"flows across lines.":"fits in part of one line.")});
  c.appendChild(d);c.appendChild(el('<div class="tip"><b>Why poets do this:</b> a long sentence across many lines can feel slow and thoughtful. Short sentences can feel sudden or emotional.</div>'));return c},
 s4:()=>{const c=learnCard("Repetition and meaning",
  '<p><b>Repetition</b> means using the same sound, word, phrase, line, or sentence pattern more than once. Rhyme is one kind of repetition.</p><p>Poets repeat on purpose: to <b>emphasize</b> an idea, to <b>build a feeling</b>, or to <b>tie the beginning and the end together</b>. When a line from the start comes back at the end, ask: <i>What has changed since the first time?</i></p>',
  "Repetition and meaning. Repetition means using the same sound, word, phrase, line, or sentence pattern more than once. Rhyme is one kind of repetition. Poets repeat on purpose: to emphasize an idea, to build a feeling, or to tie the beginning and the end together. When a line from the start comes back at the end, ask: what has changed since the first time?");
  const d=el('<div class="demo"><span class="label"><span class="dot"></span>Repetition spotlight</span></div>');const p=renderPoem("dRep",{tokens:true});d.appendChild(p);
  const bar=el('<div class="demo-bar"><button type="button" class="chipbtn" aria-pressed="false">Spotlight repeats</button></div>');d.appendChild(bar);d.appendChild(listenBtn(()=>poemText(POEMS.dRep)));
  bar.firstChild.addEventListener("click",e=>{const on=e.currentTarget.getAttribute("aria-pressed")!=="true";e.currentTarget.setAttribute("aria-pressed",on);
    p.querySelectorAll(".ln").forEach(r=>{const tk=[...r.querySelectorAll(".tok")];const words=tk.map(t=>t.textContent.toLowerCase());
      tk.forEach((t,i)=>{let hit=false;if(words.slice(0,4).join(" ")==="i wanted to be"&&i<4)hit=true;if(words[i]==="but"||(words[i]==="small"&&words[i-1]==="but"))hit=true;t.classList.toggle("spot",on&&hit)})})});
  c.appendChild(d);c.appendChild(el('<div class="tip"><b>Structure + meaning:</b> In memoirs written as poems, repetition often shows a writer looking back and seeing a memory in a new way.</div>'));return c},
 s5:()=>{const c=learnCard("Your master key: a brand-new poem",
  '<p>Memoirs are true stories about the writer’s own life. Most are written in prose, but some memoir writers use <b>poetry</b>. Read “Grandma’s Spare Key,” a memory written as a poem. Use every skill you unlocked: lines, stanzas, rhyme scheme, sentences, repetition, and meaning.</p><p>Questions are labeled by <b>DOK level</b>: <span class="dok dok1">DOK 1</span> find it, <span class="dok dok2">DOK 2</span> explain it, <span class="dok dok3">DOK 3</span> analyze and prove it.</p>',
  "Your master key: a brand new poem. Memoirs are true stories about the writer's own life. Most are written in prose, but some memoir writers use poetry. Read Grandma's Spare Key, a memory written as a poem. Use every skill you unlocked: lines, stanzas, rhyme scheme, sentences, repetition, and meaning. Questions are labeled by level. Level 1, find it. Level 2, explain it. Level 3, analyze and prove it.");return c}
};

/* ---------------- poem side panels ---------------- */
function sidePoem(key){const c=el('<div class="card sticky"></div>');
  const title=key==="frost"?"The Road Not Taken":"Grandma’s Spare Key";const by=key==="frost"?"by Robert Frost":"an original memoir poem · The Literacy Locksmith";
  const head=el('<div class="poem"><h3>'+title+'</h3><div class="by">'+by+'</div></div>');c.appendChild(head);
  const p=renderPoem(key);head.appendChild(p);
  const bar=el('<div class="demo-bar"><button type="button" class="chipbtn" aria-pressed="false">Stanza X-ray</button></div>');bar.appendChild(listenBtn(()=>title+". "+poemText(POEMS[key])));
  bar.firstChild.addEventListener("click",e=>{const on=e.currentTarget.getAttribute("aria-pressed")!=="true";e.currentTarget.setAttribute("aria-pressed",on);p.querySelectorAll(".stz").forEach(s=>s.classList.toggle("xray",on))});
  c.appendChild(bar);return c}

/* ---------------- build pages ---------------- */
const main=document.getElementById("main"),nav=document.getElementById("nav");
function navBuild(){nav.innerHTML="";
  const home=el('<button type="button" class="st-tab" data-go="start" style="--sc:var(--gold)"><span class="ic"><svg width="22" height="22"><use href="#key"/></svg></span><span>Start<small>~1 min</small></span></button>');nav.appendChild(home);
  STATIONS.forEach((s,i)=>{const b=el('<button type="button" class="st-tab'+(S.keys[s.id]?" won":"")+'" data-go="'+s.id+'" style="--sc:'+s.color+'"><span class="ic"><svg class="lock" width="16" height="16"><use href="#lock"/></svg><svg class="key" width="24" height="24"><use href="#key"/></svg></span><span>'+esc(s.name)+'<small>'+s.short+' · ~'+s.mins+' min</small></span></button>');nav.appendChild(b)});
  nav.appendChild(el('<button type="button" class="st-tab" data-go="report" style="--sc:var(--gold)"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5z" fill="currentColor"/></svg></span><span>Lab Report<small>~1 min</small></span></button>'));
  nav.querySelectorAll("[data-go]").forEach(b=>{b.addEventListener("click",()=>go(b.dataset.go));b.setAttribute("aria-current",b.dataset.go===S.cur)})}

function startPage(){
  const sec=el('<section class="panel" id="start"></section>');
  const hero=el('<div class="hero"><div><span class="label" style="--c:var(--coral)"><span class="dot"></span>30-minute interactive lab · Grade 6 ELA</span><h1 style="margin-top:8px">Unlock the <em>structure</em> of a poem</h1><p>Some memoir writers tell true stories in <b>poems</b> instead of paragraphs. Poets build meaning with <b>lines, stanzas, rhyme, punctuation, and repetition</b>. In this lab you will learn each tool, try it out, then use it to unlock “The Road Not Taken” by Robert Frost. Finish with a brand-new poem and earn your Master Key.</p></div><div class="biglogo"><svg viewBox="0 0 160 120" role="img" aria-label="The Literacy Locksmith logo"><use href="#logo"/></svg><div class="wm"><span style="color:var(--coral)">The</span> <span style="color:var(--blue)">Literacy</span><br><span style="color:var(--violet)">Locksmith</span></div><div class="tag">Unlocking Skills. Opening Minds. Building Readers.</div></div></div>');
  const left=hero.firstElementChild;
  const route=el('<div class="route"></div>');STATIONS.forEach((s,i)=>route.appendChild(el('<div style="--sc:'+s.color+'"><b>'+(i+1)+'. '+esc(s.name)+'</b><span>'+esc(s.blurb)+' ~'+s.mins+' min</span></div>')));left.appendChild(route);
  const nb=el('<div class="namebox"><label class="sr" for="stuName">Your name</label><input id="stuName" placeholder="Type your first name" autocomplete="off"><button type="button" class="go">Start the lab</button></div>');
  nb.querySelector("input").value=S.name||"";left.appendChild(nb);
  nb.querySelector("button").addEventListener("click",()=>{const v=nb.querySelector("input").value.trim();if(!v){nb.querySelector("input").focus();nb.querySelector("input").placeholder="Please type your name first";return}S.name=v;if(!S.started)S.started=Date.now();save();go("s1")});
  left.appendChild(el('<div class="stds"><b>Florida B.E.S.T.</b> ELA.6.R.1.4 Describe the impact of various poetic forms on meaning and style. · ELA.6.R.1.2 Analyze the development of stated or implied theme(s). · ELA.K12.EE.1.1 Cite evidence to explain and justify reasoning.</div>'));
  left.querySelector(".label").after(listenBtn("Unlock the structure of a poem. Some memoir writers tell true stories in poems instead of paragraphs. Poets build meaning with lines, stanzas, rhyme, punctuation, and repetition. In this lab you will learn each tool, try it out, then use it to unlock The Road Not Taken by Robert Frost. Finish with a brand new poem and earn your Master Key. Type your name and press Start the lab."));
  sec.appendChild(hero);return sec}

function stationPage(s,i){
  const sec=el('<section class="panel" id="'+s.id+'" style="--c:'+s.color+'" hidden></section>');
  sec.appendChild(el('<div class="st-head"><div class="num">'+(i+1)+'</div><div><h2>'+esc(s.name)+'</h2><p>'+esc(s.blurb)+'</p></div><span class="mins">~'+s.mins+' minutes</span></div>'));
  const qs=Q[s.id];const practice=qs.filter(q=>q.dok===0),real=qs.filter(q=>q.dok>0);
  const g1=el('<div class="grid learnrow"></div>');const tut=TUT[s.id]();g1.appendChild(tut);
  const pr=el('<div class="stack"></div>');practice.forEach(q=>pr.appendChild(mountQ(q,0)));
  if(!practice.length)pr.appendChild(el('<div class="card"><span class="label"><span class="dot"></span>How this station works</span><p style="margin:.4em 0 0">Read the poem on the left. Answer each question on the right. You get <b>two tries</b> on each one: a first-try answer earns ★★, a second-try answer earns ★. The written response at the end is checked with a checklist and a model answer.</p></div>'));
  g1.appendChild(pr);sec.appendChild(g1);
  const grid=el('<div class="grid"></div>');const left=el('<div class="stack"></div>'),right=el('<div class="stack"></div>');
  left.appendChild(sidePoem(s.id==="s5"?"gran":"frost"));
  right.appendChild(el('<div><span class="label"><span class="dot"></span>Unlock it · '+(s.id==="s5"?"Grandma’s Spare Key":"The Road Not Taken")+'</span></div>'));
  real.forEach((q,k)=>right.appendChild(mountQ(q,k+1)));
  const nextId=i<STATIONS.length-1?STATIONS[i+1].id:"report";
  const db=el('<div class="done-bar" id="done-'+s.id+'"><svg><use href="#key"/></svg><div><h3>Key earned!</h3><div class="tries">You unlocked '+esc(s.name)+'.</div></div><button type="button" class="go">'+(nextId==="report"?"See my Lab Report":"Next station")+'</button></div>');
  db.querySelector("button").addEventListener("click",()=>go(nextId));right.appendChild(db);
  grid.appendChild(left);grid.appendChild(right);sec.appendChild(grid);return sec}

function stationCheck(sid){const all=Q[sid].filter(q=>q.dok>0);const done=all.every(q=>q.type==="write"?S.w.submitted:(S.q[q.id]&&S.q[q.id].status));
  if(done){const was=S.keys[sid];S.keys[sid]=true;save();const d=document.getElementById("done-"+sid);if(d)d.classList.add("show");if(!was){burst(null,90);navBuild()}}}

function reportPage(){
  const sec=el('<section class="panel" id="report" style="--c:var(--gold-ink)" hidden></section>');sec.appendChild(el('<div class="rep-body"></div>'));return sec}
function renderReport(){
  const box=document.querySelector("#report .rep-body");box.innerHTML="";
  let pts=0,max=0;const dok={1:[0,0],2:[0,0],3:[0,0]};
  SCORED.forEach(q=>{const st=S.q[q.id];const p=st?(st.status==="first"?2:st.status==="second"?1:0):0;pts+=p;max+=2;dok[q.dok][0]+=p;dok[q.dok][1]+=2});
  const pct=Math.round(pts/max*100);const answered=SCORED.filter(q=>S.q[q.id]&&S.q[q.id].status).length;
  const keysWon=STATIONS.filter(s=>S.keys[s.id]).length;
  const cert=el('<div class="cert"><svg viewBox="0 0 160 120" style="width:120px" aria-hidden="true"><use href="#logo"/></svg><h2>'+(keysWon===5?"Master Locksmith Certificate":"Lab Report")+'</h2><div class="who">'+esc(S.name||"Student")+'</div><div>Poem Structure Lab · '+new Date().toLocaleDateString()+'</div><div class="tag" style="margin-top:6px;color:var(--muted)">Unlocking Skills. Opening Minds. Building Readers.</div></div>');
  box.appendChild(cert);
  const rep=el('<div class="rep"></div>');
  const sc=el('<div class="card"><span class="label" style="--c:var(--coral)"><span class="dot"></span>Score</span><div class="big" style="--c:var(--coral)">'+pct+'%</div><div class="tries">'+pts+' of '+max+' points · '+answered+' of '+SCORED.length+' questions answered<br>★★ first try = 2 points · ★ second try = 1 point</div></div>');
  const dk=el('<div class="card"><span class="label" style="--c:var(--violet)"><span class="dot"></span>By DOK level</span><div class="bars"></div></div>');
  const cols={1:"var(--teal)",2:"var(--violet)",3:"var(--coral)"};
  [1,2,3].forEach(l=>{const [a,b]=dok[l];const p=b?Math.round(a/b*100):0;const r=el('<div class="bar"><span>DOK '+l+'</span><div class="tr"><div class="fl" style="background:'+cols[l]+'"></div></div><span>'+p+'%</span></div>');dk.querySelector(".bars").appendChild(r);requestAnimationFrame(()=>requestAnimationFrame(()=>r.querySelector(".fl").style.width=p+"%"))});
  const ky=el('<div class="card"><span class="label" style="--c:var(--blue)"><span class="dot"></span>Keys earned · '+keysWon+' of 5</span><div class="keys"></div></div>');
  STATIONS.forEach(s=>ky.querySelector(".keys").appendChild(el('<div class="k'+(S.keys[s.id]?" won":"")+'" style="--sc:'+s.color+'" title="'+esc(s.name)+'">'+(S.keys[s.id]?'<svg><use href="#key"/></svg>':'<svg width="20" height="20" style="color:var(--muted)"><use href="#lock"/></svg>')+'</div>')));
  rep.appendChild(sc);rep.appendChild(dk);rep.appendChild(ky);box.appendChild(rep);
  // copy
  const lines=["POEM STRUCTURE LAB - The Literacy Locksmith","Student: "+(S.name||""),"Date: "+new Date().toLocaleDateString(),"Score: "+pct+"% ("+pts+"/"+max+" points)","DOK 1: "+dok[1][0]+"/"+dok[1][1]+"  DOK 2: "+dok[2][0]+"/"+dok[2][1]+"  DOK 3: "+dok[3][0]+"/"+dok[3][1],"Keys: "+keysWon+"/5",""];
  STATIONS.forEach(s=>{lines.push(s.name.toUpperCase());Q[s.id].filter(q=>q.dok>0&&q.type!=="write").forEach((q,i)=>{const st=S.q[q.id];lines.push("  Q"+(i+1)+" (DOK "+q.dok+"): "+(st&&st.status?{first:"correct 1st try",second:"correct 2nd try",missed:"missed"}[st.status]:"not answered"))})});
  lines.push("","WRITTEN RESPONSE (DOK 3):",S.w.text||(S.w.ink?"[handwritten on pencil pad]":"[not submitted]"),"Self-check: "+(S.w.checks||[]).filter(Boolean).length+"/4");
  const txt=lines.join("\n");
  const cp=el('<div class="card" style="margin-top:16px"><span class="label" style="--c:var(--green)"><span class="dot"></span>Turn it in</span><p style="margin:.4em 0">Copy your lab report and paste it where your teacher asks (Canvas, email, or a doc).</p><div class="qact" style="margin-top:0"><button type="button" class="check" style="--c:var(--green)">Copy my lab report</button><span class="tries" aria-live="polite"></span></div><pre class="copybox" tabindex="0"></pre></div>');
  cp.querySelector("pre").textContent=txt;
  cp.querySelector("button").addEventListener("click",()=>{const m=cp.querySelector(".tries");const pre=cp.querySelector("pre");
    const sel=()=>{const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);m.textContent="Text selected. Press Copy (or Ctrl/Cmd + C)."};
    try{navigator.clipboard.writeText(txt).then(()=>m.textContent="Copied!",sel)}catch(e){sel()}});
  box.appendChild(cp);
  if(keysWon===5)burst(null,140);
}

function go(id){S.cur=id;save();try{speechSynthesis.cancel()}catch(e){}
  document.querySelectorAll("section.panel").forEach(s=>s.hidden=s.id!==id);
  nav.querySelectorAll("[data-go]").forEach(b=>b.setAttribute("aria-current",b.dataset.go===id));
  const t=nav.querySelector('[data-go="'+id+'"]');if(t&&t.scrollIntoView)t.scrollIntoView({block:"nearest",inline:"center"});
  if(id==="report")renderReport();
  window.scrollTo({top:0,behavior:"smooth"})}

/* ---------------- timer ---------------- */
const tEl=document.getElementById("timer");
function tick(){if(!S.started){tEl.textContent="30:00";return}const left=30*60-Math.floor((Date.now()-S.started)/1000);const a=Math.abs(left);const m=Math.floor(a/60),s=a%60;
  tEl.textContent=(left<0?"+":"")+m+":"+String(s).padStart(2,"0");tEl.classList.toggle("late",left<0);tEl.title=left<0?"Over the 30-minute target":"Time left in the 30-minute lab"}
setInterval(tick,1000);

/* ---------------- confetti ---------------- */
const cv=document.getElementById("confetti"),cx=cv.getContext("2d");let parts=[],anim=null;
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(fromEl,n){if(reduce)return;const d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;
  let x=innerWidth/2,y=innerHeight/3;if(fromEl){const r=fromEl.getBoundingClientRect();x=r.left+r.width/2;y=r.top+30}
  const cs=["#F2B21B","#EF5B52","#2A73E0","#0E9C98","#7656DD","#23995A"];
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*(fromEl?6:14),vy:-Math.random()*(fromEl?6:12)-2,s:4+Math.random()*6,c:cs[i%6],r:Math.random()*6,life:0});
  if(!anim)anim=requestAnimationFrame(step)}
function step(){const d=window.devicePixelRatio||1;cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.r+=.1;p.life++;cx.save();cx.translate(p.x*d,p.y*d);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s*d/2,-p.s*d/4,p.s*d,p.s*d/2);cx.restore()});
  parts=parts.filter(p=>p.y<innerHeight+40&&p.life<240);anim=parts.length?requestAnimationFrame(step):(cx.clearRect(0,0,cv.width,cv.height),null)}

/* ---------------- teacher panel ---------------- */
const tp=document.getElementById("teacher");
document.getElementById("tBtn").addEventListener("click",()=>{tp.hidden=!tp.hidden;if(!tp.hidden)teacherLock()});
function teacherLock(){tp.innerHTML="";const f=el('<div><span class="label" style="--c:var(--violet)"><span class="dot"></span>Teacher tools</span><p style="margin:.4em 0">Enter the teacher code to see the answer key and reset options.</p><div class="namebox" style="margin-top:0"><label class="sr" for="tcode">Teacher code</label><input id="tcode" type="password" placeholder="Teacher code"><button type="button" class="check" style="--c:var(--violet)">Open</button></div><div class="tries" aria-live="polite"></div></div>');
  f.querySelector("button").addEventListener("click",()=>{if(f.querySelector("input").value.trim().toUpperCase()==="LOCKSMITH")teacherKey();else f.querySelector(".tries").textContent="That code did not match."});tp.appendChild(f)}
function teacherKey(){tp.innerHTML="";
  const ans=q=>q.type==="mc"?"ABCD"[q.answer]+". "+q.opts[q.answer]:q.type==="multi"?q.answer.map(i=>"ABCD"[i]).join(" + ")+" ("+(q.reveal||"")+")":q.reveal||String(q.answer);
  let rows="";STATIONS.forEach(s=>{let k=0;Q[s.id].forEach(q=>{if(q.dok===0)return;k++;rows+='<tr><td>'+esc(s.short)+' Q'+k+'</td><td>'+q.dok+'</td><td>'+esc(q.prompt)+'</td><td>'+esc(q.type==="write"?"Model answer shown to students after submitting; use the 4-point checklist.":ans(q))+'</td></tr>'})});
  const c=el('<div><span class="label" style="--c:var(--violet)"><span class="dot"></span>Answer key</span><div class="tblwrap"><table class="keytable"><thead><tr><th>Item</th><th>DOK</th><th>Question</th><th>Answer</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="qact"><button type="button" class="check" style="--c:var(--coral)" id="rs1">Reset this device for a new student</button><span class="tries" aria-live="polite"></span></div></div>');
  const rb=c.querySelector("#rs1");let armed=false;rb.addEventListener("click",()=>{if(!armed){armed=true;rb.textContent="Tap again to erase all answers";c.querySelector(".qact .tries").textContent="This clears the name, answers, and writing on this device.";return}
    try{localStorage.removeItem(KEY)}catch(e){}location.reload()});
  tp.appendChild(c)}

/* ---------------- boot ---------------- */
main.appendChild(startPage());STATIONS.forEach((s,i)=>main.appendChild(stationPage(s,i)));main.appendChild(reportPage());
navBuild();STATIONS.forEach(s=>{if(S.keys[s.id]){const d=document.getElementById("done-"+s.id);if(d)d.classList.add("show")}});
go(S.cur&&document.getElementById(S.cur)?S.cur:"start");tick();
})();
</script>
